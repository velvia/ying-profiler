[package]
name = "ying-profiler"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Evan Chan <velvia@gmail.com>"]
description = "Sampling retained memory profiler for Rust, low resource usage, can write out flamegraphs."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/velvia/ying-profiler"
documentation = "https://docs.rs/ying-profiler"
exclude = ["/.github", "/target", "*.svg"]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
]
keywords = ["profiling", "sampling", "memory", "profiler", "flamegraph"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backtrace = "^0.3"
coarsetime = "^0.1"
chrono = "0.4"
log = "^0.4"
once_cell = "1.14"
regex = "^1.6"
wyhash = "0.5.0"
tracing = { version = "^0.1.30", optional = true }
inferno = "0.12"
derive_builder = "0.20"

[target."cfg(unix)".dependencies]
libc = "^0.2"

[dev-dependencies]
futures = "^0.3"
moka = "0.9"
rand = { version = "0.8", features = ["small_rng"] }  # no-std, so no allocation
serial_test = "0.9.0"
tokio = { version = "1.20.1", features = ["full"] }
tracing-subscriber = "0.3"

[features]
profile-spans = ["tracing"]

[profile.bench]
strip = "none"
# debug = 1 means line charts only, which is minimum needed for good stack traces
debug = 1

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
